plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// URL del backend. Por defecto el emulador apunta al backend local (10.0.2.2 = localhost de la PC).
// Para otro destino: ./gradlew installRelease -PsubastasBaseUrl=https://mi-backend.example.com/
// Modo demo (por defecto activo): la app funciona sin backend con datos ficticios en memoria.
// Para usar el backend real: -PdemoMode=false
def demoMode = (project.findProperty('demoMode') ?: 'true').toString()
def subastasBaseUrl = (project.findProperty('subastasBaseUrl') ?: 'http://10.0.2.2:8080/').toString()

android {
    namespace 'com.subastasapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.subastasapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        // El emulador resuelve 10.0.2.2 como el localhost de la PC anfitriona.
        // Para un device físico: -PsubastasBaseUrl=http://<IP LAN de la PC>:8080/
        debug {
            buildConfigField "boolean", "DEMO_MODE", demoMode
            buildConfigField "String", "BASE_URL", "\"${subastasBaseUrl}\""
        }
        // Firmamos con el keystore debug por simplicidad (entrega académica, no Play Store).
        release {
            buildConfigField "boolean", "DEMO_MODE", demoMode
            buildConfigField "String", "BASE_URL", "\"${subastasBaseUrl}\""
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.1.1'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "io.coil-kt:coil-compose:2.5.0"
    
    // Retrofit para conectar con el backend
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
