spring.application.name=subastas-backend

# --- Base de datos (PostgreSQL) ---------------------------------------------------------
# Nada de credenciales en el repo: todo llega por variables de entorno.
# Para correr en local ver README.md (docker compose levanta un Postgres y define estas variables).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subastasdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Sin valor por defecto a propósito: si falta, la app no arranca.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# 'update' deja que Hibernate complete el esquema; en producción conviene 'validate' + migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# --- JWT ----------------------------------------------------------------------------------
# Obligatoria, mínimo 32 caracteres. Generar una con:  openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Otros --------------------------------------------------------------------------------
# Solo desarrollo: imprime el código de recuperación de contraseña en consola (no hay servicio de mail).
app.log-reset-codes=${LOG_RESET_CODES:false}
# Emails (separados por coma) que pueden aprobar/rechazar consignaciones. Vacío = nadie.
app.admin-emails=${ADMIN_EMAILS:}
# Orígenes permitidos para el WebSocket (coma-separados).
app.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server.port=${PORT:8080}
